name: Build and Verify Dual-Language CVs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils fonts-noto-cjk fonts-wqy-zenhei

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and Enforce Strict Page Restrictions
        run: |
          python3 scripts/build_and_verify.py

      - name: Upload Verified PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sisheng-Chris-Zhang-CVs
          path: |
            CV Sisheng Chris Zhang.pdf
            CV 简历 张斯盛 西班牙庞培法布拉大学博士.pdf
            cv-bilingual.pdf
          retention-days: 30
