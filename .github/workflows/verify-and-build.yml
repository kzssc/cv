name: Build and Verify Strict 2-Page CV

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.md'
      - '_layouts/**'
      - 'media/**'
      - '_config.yml'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils chromium-browser

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build HTML, Render PDF, and Enforce 2-Page Restriction
        env:
          CHROME_BIN: /usr/bin/chromium-browser
        run: |
          python3 scripts/build_and_verify.py

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sisheng-Chris-Zhang-CV
          path: cv.pdf
          retention-days: 30

      - name: Commit Updated PDF
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update compiled cv.pdf from index.md [skip ci]"
            git push
          else
            echo "cv.pdf is already up to date."
          fi
